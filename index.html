<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bug 复盘报告</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    text-align: center;
    max-width: 600px;
  }
  h1 {
    font-size: 32px;
    margin-bottom: 24px;
    background: linear-gradient(135deg, #38bdf8, #818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 32px;
    transition: transform 0.2s, border-color 0.2s;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: #38bdf8;
  }
  .card h2 {
    font-size: 20px;
    margin-bottom: 12px;
    color: #e2e8f0;
  }
  .card p {
    color: #94a3b8;
    font-size: 14px;
    margin-bottom: 24px;
  }
  .btn {
    display: inline-block;
    background: linear-gradient(135deg, #38bdf8, #818cf8);
    color: #fff;
    text-decoration: none;
    padding: 12px 32px;
    border-radius: 8px;
    font-weight: 600;
    transition: opacity 0.2s;
  }
  .btn:hover {
    opacity: 0.9;
  }
  .date {
    margin-top: 24px;
    font-size: 12px;
    color: #64748b;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Bug 复盘报告</h1>
  <div class="card">
    <h2>线上问题复盘报告</h2>
    <p>2026年5月13日复盘分析报告，包含 13 个线上问题深度分析</p>
    <a href="bug_review_report_20260513.html" class="btn">查看报告</a>
    <div class="date">报告生成时间：2026-05-13</div>
  </div>
</div>
</body>
</html>
